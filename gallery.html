<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery — Ivy & Rose Floral Co.</title>
  <meta name="description" content="View handcrafted floral arrangements from Ivy & Rose Floral Co. in Hamilton, Ohio.">
  <meta property="og:title" content="Gallery — Ivy & Rose Floral Co.">
  <meta property="og:description" content="Handcrafted floral arrangements for every occasion.">
  <meta property="og:image" content="https://ivyrosefloralco.com/images/bouquet-new-1.jpg">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="https://ivyrosefloralco.com/gallery.html">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Playfair+Display:wght@400;700&family=Source+Serif+Pro:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="font-source">
  <a href="#main" class="skip-link">Skip to content</a>

  <!-- Header -->
  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="site-logo" aria-label="Ivy & Rose Floral Co. home">Ivy &amp; Rose Floral Co.</a>
      <div class="nav-desktop">
        <nav class="nav-links" aria-label="Main navigation">
          <a href="order.html" class="nav-link">Order</a>
          <a href="gallery.html" class="nav-link" aria-current="page">Gallery</a>
          <a href="inquiry.html" class="nav-link">Contact</a>
        </nav>
      </div>
      <button class="menu-toggle md:hidden" aria-label="Menu" aria-expanded="false" aria-controls="mobileNavPanel">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- Mobile Nav Backdrop -->
  <div class="nav-backdrop" id="navBackdrop"></div>
  <!-- Mobile Nav Panel -->
  <nav class="main-nav" id="mobileNavPanel" aria-label="Mobile navigation">
    <div class="nav-links">
      <a href="index.html" class="nav-link">Home</a>
      <a href="order.html" class="nav-link">Order</a>
      <a href="gallery.html" class="nav-link">Gallery</a>
      <a href="inquiry.html" class="nav-link">Contact</a>
    </div>
  </nav>

  <main id="main" class="container-medium py-16">
    <h1 class="font-playfair text-4xl md:text-5xl text-center mb-4">Our Work</h1>
    <p class="text-taupe text-center mb-12 max-w-md mx-auto">Handcrafted arrangements made with love and fresh, seasonal blooms.</p>

    <!-- Clean Image Grid -->
    <div class="gallery-grid gallery-image-only">
      <div class="gallery-image-card">
        <img src="images/bouquet-mothers-day-md.jpg" alt="Vibrant seasonal bouquet close-up" loading="lazy" decoding="async">
      </div>
      <div class="gallery-image-card">
        <img src="images/bouquet-new-1.jpg" alt="Elegant ivory and burgundy arrangement" loading="lazy" decoding="async">
      </div>
      <div class="gallery-image-card">
        <img src="images/bouquet-new-2.jpg" alt="Soft pastel handcrafted arrangement" loading="lazy" decoding="async">
      </div>
      <div class="gallery-image-card">
        <img src="images/bouquet-1.jpg" alt="Classic floral arrangement with roses" loading="lazy" decoding="async">
      </div>
      <div class="gallery-image-card">
        <img src="images/bouquet-2.jpg" alt="Vibrant colorful bouquet arrangement" loading="lazy" decoding="async">
      </div>
      <div class="gallery-image-card">
        <img src="images/bouquet-3.jpg" alt="Garden style pastel arrangement" loading="lazy" decoding="async">
      </div>
    </div>

    <div class="text-center mt-12">
      <a href="order.html" class="btn btn-primary">Order Your Bouquet</a>
    </div>
  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="footer-inner">
      <div class="footer-top">
        <div class="footer-brand">
          <p class="footer-brand-name">Ivy &amp; Rose Floral Co.</p>
          <p class="footer-brand-location">Hamilton, Ohio</p>
        </div>
        <div class="footer-social">
          <a href="https://instagram.com/ivyrosefloralco" target="_blank" rel="noopener noreferrer" aria-label="Visit Ivy &amp; Rose Floral Co. on Instagram">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg>
          </a>
        </div>
      </div>
      <div class="footer-bottom">
        <p class="footer-copyright">© 2026 Ivy &amp; Rose Floral Co. All rights reserved.</p>
      </div>
    </div>

  <script src="js/main.js"></script>
